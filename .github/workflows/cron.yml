name: Outsiderr Cron Jobs

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 2 * * *'
    - cron: '0 3 * * 0'

jobs:
  expire-reservations:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reservation expiry
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/expire-reservations"

  daily-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily backup
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/backup?type=daily"

  weekly-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly backup
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/backup?type=weekly"
