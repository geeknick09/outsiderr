<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline - Outsiderr</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1.2rem; padding: 1.5rem; text-align: center;
    background: radial-gradient(1200px 600px at 50% -10%, rgba(139,92,246,.18), transparent),
                #0a0a0b; color: #fafafa; font-family: system-ui, sans-serif;
  }
  h1 { font-size: clamp(1.5rem, 5vw, 2.2rem); font-weight: 900; letter-spacing: -0.02em; }
  .badge {
    font-size: .7rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: #a78bfa; border: 1px solid rgba(139,92,246,.4); border-radius: 999px;
    padding: .35rem .9rem;
  }
  p.sub { color: #a1a1aa; font-size: .95rem; max-width: 32ch; }
  canvas {
    border-radius: 1.2rem; border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.03);
    box-shadow: 0 0 40px rgba(139,92,246,.15);
    touch-action: none; max-width: 92vw; max-height: 46vh;
  }
  .hint { font-size: .75rem; color: #71717a; }
  #score { font-size: .85rem; font-weight: 700; color: #a3e635; }
</style>
</head>
<body>
  <span class="badge">Outsiderr</span>
  <h1>You're offline</h1>
  <p class="sub">No connection right now — your feed, tickets and communities will be right here when you're back.</p>
  <p class="hint">Meanwhile — a quick snake break 🐍</p>
  <canvas id="game" width="360" height="360"></canvas>
  <p id="score">Score: 0</p>
  <p class="hint">Arrow keys / WASD · swipe on mobile</p>
<script>
(() => {
  const c = document.getElementById("game"), x = c.getContext("2d"), S = 18, N = 20;
  let snake = [{x:10,y:10}], dir = {x:1,y:0}, food = rnd(), score = 0, dead = false, speed = 140;
  function rnd(){ let p; do { p = {x:(Math.random()*N)|0, y:(Math.random()*N)|0}; } while (snake.some(s=>s.x===p.x&&s.y===p.y)); return p; }
  function step(nx,ny){ if (nx===-dir.x && ny===-dir.y) return; dir={x:nx,y:ny}; }
  addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (k==="arrowup"||k==="w") step(0,-1);
    else if (k==="arrowdown"||k==="s") step(0,1);
    else if (k==="arrowleft"||k==="a") step(-1,0);
    else if (k==="arrowright"||k==="d") step(1,0);
    else if (dead) reset();
  });
  let tx, ty;
  addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > Math.abs(dy)) step(dx > 0 ? 1 : -1, 0); else step(0, dy > 0 ? 1 : -1);
  }, {passive:true});
  function reset(){ snake=[{x:10,y:10}]; dir={x:1,y:0}; score=0; dead=false; food=rnd();
    document.getElementById("score").textContent="Score: 0"; }
  function tick(){
    if (!dead) {
      const h = {x:(snake[0].x+dir.x+N)%N, y:(snake[0].y+dir.y+N)%N};
      if (snake.some(s=>s.x===h.x&&s.y===h.y)) dead = true;
      else {
        snake.unshift(h);
        if (h.x===food.x&&h.y===food.y){ score++; food=rnd(); speed=Math.max(60,speed-2);
          document.getElementById("score").textContent="Score: "+score; }
        else snake.pop();
      }
    }
    x.fillStyle="rgba(255,255,255,.02)"; x.fillRect(0,0,c.width,c.height);
    x.strokeStyle="rgba(255,255,255,.04)";
    for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,c.height);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(c.width,i*S);x.stroke();}
    x.fillStyle="#a3e635"; x.beginPath(); x.arc(food.x*S+S/2,food.y*S+S/2,S/2.6,0,7); x.fill();
    snake.forEach((s,i)=>{ const g=x.createLinearGradient(s.x*S,s.y*S,(s.x+1)*S,(s.y+1)*S);
      g.addColorStop(0,i===0?"#c4b5fd":"#8b5cf6"); g.addColorStop(1,i===0?"#8b5cf6":"#6d28d9");
      x.fillStyle=g; x.beginPath(); x.roundRect(s.x*S+1,s.y*S+1,S-2,S-2,5); x.fill(); });
    if (dead){ x.fillStyle="rgba(10,10,11,.7)"; x.fillRect(0,0,c.width,c.height);
      x.fillStyle="#fafafa"; x.font="bold 20px system-ui"; x.textAlign="center";
      x.fillText("Game over",c.width/2,c.height/2-12);
      x.font="13px system-ui"; x.fillStyle="#a1a1aa";
      x.fillText("Score "+score+" — press any key to retry",c.width/2,c.height/2+14); }
    setTimeout(tick, dead ? 300 : speed);
  }
  tick();
})();
</script>
</body>
</html>
